<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankData Davin</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-color: #2c3e50;
            --primary: #3498db;
            --danger: #e74c3c;
            --success: #2ecc71;
            --border: #dcdde1;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --card-bg: rgba(22, 33, 62, 0.92);
            --text-color: #f5f6fa;
            --primary: #00d2ff;
            --border: #2f3640;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        .toggle-btn {
            padding: 8px 14px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            background: #ddd;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h2 {
            margin-bottom: 5px;
            color: var(--text-color);
        }

        .profile-info p {
            color: gray;
            font-size: 0.9rem;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .menu-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--border);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
        }

        .menu-card h2 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        .btn-back {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-content.active {
            display: block;
        }

        .clock {
            font-size: 2.5rem;
            text-align: center;
            font-weight: bold;
            color: var(--success);
            margin: 10px 0 20px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
        }

        button.btn-add {
            background: var(--primary);
            color: #ffffff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .data-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--card-bg);
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .btn-del {
            background: var(--danger);
            color: #ffffff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            background: var(--border);
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 5px;
        }

        .badge-room { background: #dff9fb; color: #130f40; }
        .badge-task { background: #fbe2e5; color: #c0392b; }

        .bg-picker {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .bg-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }
    </style>
</head>
<body data-theme="light">

<div class="header">
    <h1>BankData Davin</h1>
    <div class="header-btns">
        <button class="toggle-btn" id="themeBtn" onclick="toggleMode()">Bright Mode</button>
        <button class="toggle-btn" onclick="resetApp()" style="background:var(--danger); color:white;">Reset App</button>
    </div>
</div>

<div class="container">

    <!-- DASHBOARD UTAMA -->
    <div id="pageMain">
        
        <div class="profile-card">
            <img id="avatarImg" class="profile-avatar" src="https://via.placeholder.com/80?text=Foto" alt="Foto Profil">
            <div class="profile-info">
                <h2>Halo, Davin! 👋</h2>
                <p>Pilih tema background kesukaanmu di bawah:</p>
                <div class="bg-picker">
                    <div class="bg-option" style="background:#f4f6f9;" onclick="setBg('')" title="Default"></div>
                    <div class="bg-option" style="background:url('https://images.unsplash.com/photo-1518655048521-f130df041f66?w=500'); background-size:cover;" onclick="setBg('https://images.unsplash.com/photo-1518655048521-f130df041f66?w=1200')" title="Minimalist"></div>
                    <div class="bg-option" style="background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500'); background-size:cover;" onclick="setBg('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200')" title="Pantai"></div>
                    <div class="bg-option" style="background:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500'); background-size:cover;" onclick="setBg('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200')" title="Gunung Malam"></div>
                </div>
            </div>
            <div>
                <label for="uploadPhoto" style="cursor:pointer; font-size:0.8rem; background:var(--primary); color:white; padding:6px 12px; border-radius:6px; display:inline-block;">Ganti Foto</label>
                <input type="file" id="uploadPhoto" accept="image/*" style="display:none;" onchange="changeAvatar(event)">
            </div>
        </div>

        <h3 style="margin-bottom: 10px; color: var(--primary);">Pilih Menu</h3>
        <div class="grid-menu">
            <div class="menu-card" onclick="openPage('Kuliah')">
                <div style="font-size: 2.5rem; margin-bottom: 10px;">🎓</div>
                <h2>Kuliah</h2>
                <p style="color: gray; font-size: 0.85rem;">Jadwal, Alarm, & Folder Tugas</p>
            </div>
        </div>
    </div>

    <!-- SUB-MENU KULIAH -->
    <div id="pageKuliah" style="display: none;">
        <button class="btn-back" onclick="openPage('Main')">⬅ Kembali ke Dashboard</button>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tabJadwal', this)">📅 Jadwal</button>
            <button class="tab-btn" onclick="switchTab('tabAlarm', this)">🔔 Alarm</button>
            <button class="tab-btn" onclick="switchTab('tabFolder', this)">📁 Folder Tugas</button>
        </div>

        <!-- JADWAL -->
        <div id="tabJadwal" class="tab-content active">
            <h3 style="margin-bottom: 15px; color: var(--primary);">Jadwal Kuliah</h3>
            <div class="form-group">
                <select id="schDay">
                    <option value="Senin">Senin</option>
                    <option value="Selasa">Selasa</option>
                    <option value="Rabu">Rabu</option>
                    <option value="Kamis">Kamis</option>
                    <option value="Jumat">Jumat</option>
                    <option value="Sabtu">Sabtu</option>
                </select>
                <input type="text" id="schTime" placeholder="Jam (contoh: 08:00)">
                <input type="text" id="schSubject" placeholder="Mata Kuliah">
                <input type="text" id="schRoom" placeholder="Ruangan (contoh: 07.03.15A)">
                <input type="text" id="schTask" placeholder="Remember Tugas">
                <button class="btn-add" onclick="addSchedule()">Tambah Jadwal</button>
            </div>
            <ul class="data-list" id="scheduleList"></ul>
        </div>

        <!-- ALARM -->
        <div id="tabAlarm" class="tab-content">
            <h3 style="margin-bottom: 15px; color: var(--primary);">Alarm Kuliah</h3>
            <div class="clock" id="clockDisplay">00:00:00</div>
            <div class="form-group">
                <input type="time" id="alarmTime">
                <input type="text" id="alarmNote" placeholder="Keterangan alarm">
                <button class="btn-add" onclick="addAlarm()">Set Alarm</button>
            </div>
            <ul class="data-list" id="alarmList"></ul>
        </div>

        <!-- FOLDER TUGAS -->
        <div id="tabFolder" class="tab-content">
            <h3 style="margin-bottom: 15px; color: var(--primary);">Folder Tugas & Materi</h3>
            <div class="form-group">
                <input type="file" id="fileChoice">
                <input type="text" id="fileCategory" placeholder="Kategori / Nama Tugas">
                <button class="btn-add" onclick="uploadFile()">Unggah File</button>
            </div>
            <ul class="data-list" id="fileList"></ul>
        </div>

    </div>

</div>

<script>
    // --- AMAN DARI BLANK (Pembersih jika memori berlebih) ---
    function resetApp() {
        if(confirm("Reset semua data di web ini jika terjadi error?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // --- BACKGROUND ---
    let savedBg = localStorage.getItem('davBgUrl') || '';
    if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

    function setBg(url) {
        document.body.style.backgroundImage = url ? `url('${url}')` : 'none';
        localStorage.setItem('davBgUrl', url);
    }

    // --- FOTO PROFIL ---
    try {
        let savedPhoto = localStorage.getItem('davPhoto');
        if (savedPhoto) document.getElementById('avatarImg').src = savedPhoto;
    } catch(e) {}

    function changeAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 500 * 1024) return alert("Pilih foto dengan ukuran kecil (di bawah 500 KB) agar tidak lemot.");

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                document.getElementById('avatarImg').src = e.target.result;
                localStorage.setItem('davPhoto', e.target.result);
            } catch(err) {
                alert("Memori browser penuh, gunakan foto yang ukurannya lebih kecil.");
            }
        };
        reader.readAsDataURL(file);
    }

    // --- NAVIGASI ---
    function openPage(pageName) {
        document.getElementById('pageMain').style.display = pageName === 'Main' ? 'block' : 'none';
        document.getElementById('pageKuliah').style.display = pageName === 'Kuliah' ? 'block' : 'none';
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    // --- MODE BRIGHT/DARK ---
    let mode = localStorage.getItem('mode') || 'light';
    document.body.setAttribute('data-theme', mode);
    document.getElementById('themeBtn').innerText = mode === 'dark' ? 'Dark Mode' : 'Bright Mode';

    function toggleMode() {
        mode = mode === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', mode);
        localStorage.setItem('mode', mode);
        document.getElementById('themeBtn').innerText = mode === 'dark' ? 'Dark Mode' : 'Bright Mode';
    }

    // --- JAM & ALARM ---
    function runClock() {
        const now = new Date();
        document.getElementById('clockDisplay').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
        checkAlarm(now);
    }
    setInterval(runClock, 1000);

    let alarms = JSON.parse(localStorage.getItem('davAlarms')) || [];

    function renderAlarms() {
        const list = document.getElementById('alarmList');
        list.innerHTML = '';
        alarms.forEach((item, index) => {
            list.innerHTML += `<li class="item"><div><b>${item.time}</b> - ${item.note}</div><button class="btn-del" onclick="delAlarm(${index})">Hapus</button></li>`;
        });
        localStorage.setItem('davAlarms', JSON.stringify(alarms));
    }

    function addAlarm() {
        const time = document.getElementById('alarmTime').value;
        const note = document.getElementById('alarmNote').value || 'Alarm Kuliah';
        if (!time) return alert('Pilih jam alarm dulu!');
        alarms.push({ time, note, active: true });
        document.getElementById('alarmTime').value = '';
        document.getElementById('alarmNote').value = '';
        renderAlarms();
    }

    function delAlarm(index) { alarms.splice(index, 1); renderAlarms(); }

    function checkAlarm(now) {
        const currentHM = now.toTimeString().substring(0, 5);
        alarms.forEach(item => {
            if (item.time === currentHM && item.active) {
                alert('BANKDATA DAVIN ALARM: ' + item.note);
                item.active = false;
                renderAlarms();
            }
            if (item.time !== currentHM) item.active = true;
        });
    }

    // --- JADWAL ---
    let schedules = JSON.parse(localStorage.getItem('davSchedules')) || [];

    function renderSchedules() {
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        schedules.forEach((item, index) => {
            const roomInfo = item.room ? `<span class="badge badge-room">Ruang: ${item.room}</span>` : '';
            const taskInfo = item.task ? `<span class="badge badge-task">Tugas: ${item.task}</span>` : '';
            list.innerHTML += `<li class="item"><div><b>${item.subject}</b><br><small><span class="badge">${item.day}</span> Jam: ${item.time} ${roomInfo} ${taskInfo}</small></div><button class="btn-del" onclick="delSchedule(${index})">Hapus</button></li>`;
        });
        localStorage.setItem('davSchedules', JSON.stringify(schedules));
    }

    function addSchedule() {
        const day = document.getElementById('schDay').value;
        const time = document.getElementById('schTime').value || '--:--';
        const subject = document.getElementById('schSubject').value;
        const room = document.getElementById('schRoom').value;
        const task = document.getElementById('schTask').value;
        if (!subject) return alert('Isi mata kuliah dulu!');
        schedules.push({ day, time, subject, room, task });
        renderSchedules();
    }

    function delSchedule(index) { schedules.splice(index, 1); renderSchedules(); }

    // --- FILE ---
    let files = JSON.parse(localStorage.getItem('davFiles')) || [];

    function renderFiles() {
        const list = document.getElementById('fileList');
        list.innerHTML = '';
        files.forEach((item, index) => {
            list.innerHTML += `<li class="item"><div><a href="${item.data}" download="${item.name}" style="color:var(--primary); font-weight:bold;">${item.name}</a><br><small><span class="badge">${item.cat}</span> Ukuran: ${item.size}</small></div><button class="btn-del" onclick="delFile(${index})">Hapus</button></li>`;
        });
        localStorage.setItem('davFiles', JSON.stringify(files));
    }

    function uploadFile() {
        const input = document.getElementById('fileChoice');
        const cat = document.getElementById('fileCategory').value || 'Umum';
        const file = input.files[0];
        if (!file) return alert('Pilih file dulu!');
        if (file.size > 1024 * 1024) return alert('File terlalu besar! Maksimal 1MB.');

        const reader = new FileReader();
        reader.onload = function(e) {
            files.push({ name: file.name, cat: cat, size: (file.size / 1024).toFixed(1) + ' KB', data: e.target.result });
            renderFiles();
        };
        reader.readAsDataURL(file);
    }

    function delFile(index) { files.splice(index, 1); renderFiles(); }

    renderAlarms(); renderSchedules(); renderFiles(); runClock();
</script>

</body>
</html>
